name: westchester
description: "Westchester Courier Driver App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  get: ^4.7.2
  get_it: ^9.2.1

  # Navigation
  go_router: ^17.2.3

  # Network
  dio: ^5.9.0
  internet_connection_checker_plus: ^3.0.1

  # Local Storage
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  gap: ^3.0.1
  flutter_svg: ^2.2.4
  flutter_spinkit: ^5.2.2
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  flutter_html: ^3.0.0
  pin_code_fields: ^9.3.0

  # Image
  image_picker: ^1.2.2

  # Utilities
  intl: ^0.20.2
  logger: ^2.6.2
  share_plus: ^13.1.0
  url_launcher: ^6.3.2

  # Socket
  socket_io_client: ^3.1.4

  # Preview
  device_preview: ^1.3.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.5.4


flutter_gen:
  output: lib/gen/

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: HelveticaNeue
      fonts:
        - asset: assets/fonts/HelveticaNeueLight.ttf
          weight: 400
        - asset: assets/fonts/HelveticaNeueBold.ttf
          weight: 600
        - asset: assets/fonts/HelveticaNeueMedium.ttf
          weight: 700

